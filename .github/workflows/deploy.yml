 name: Publish resume
                                                                                                           on:
   push:                                                                                                       branches: [main]
   workflow_dispatch:                                                                                     
 permissions:                                                                                                contents: read
   pages: write
   id-token: write

 concurrency:
   group: pages
   cancel-in-progress: true
                                                                                                           jobs:
   build-deploy:                                                                                               runs-on: ubuntu-latest
     environment:                                                                                                name: github-pages
       url: ${{ steps.deploy.outputs.page_url }}                                                               steps:
       - uses: actions/checkout@v4                                                                                 with:
           fetch-depth: 0            # full history so we can find the newest PDF by commit               
       - name: Select newest PDF -> resume.pdf                                                                     run: |
           set -euo pipefail                                                                                         # Newest *.pdf by the most recent commit that touched a PDF (filename-agnostic).
           latest="$(git log --name-only --diff-filter=d --pretty=format: -- '*.pdf' '*.PDF' \                                 | grep -iE '\.pdf$' | head -n1 || true)"
           # Fallback: any pdf currently in the tree.                                                                if [ -z "${latest:-}" ] || [ ! -f "$latest" ]; then
             latest="$(find . -maxdepth 2 -iname '*.pdf' -print | head -n1)"
           fi
           if [ -z "${latest:-}" ]; then
             echo "No PDF found in repo" >&2; exit 1
           fi
           echo "Publishing: $latest"
           mkdir -p _site                                                                                            cp "$latest" _site/resume.pdf
                                                                                                                 - uses: actions/upload-pages-artifact@v3
         with:                                                                                                        path: _site
                                                                                                                 - id: deploy
         uses: actions/deploy-pages@v4
